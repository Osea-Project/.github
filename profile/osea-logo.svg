<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Logo Project Osea : un serveur flotte au-dessus de vagues dans un cercle">
  <defs>
    <clipPath id="disc">
      <circle cx="256" cy="256" r="233"/>
    </clipPath>
  </defs>

  <!-- Disque -->
  <circle cx="256" cy="256" r="248" fill="#0E1B2A"/>

  <!-- Vagues, de la plus claire (haut) à la plus sombre (bas) -->
  <g clip-path="url(#disc)">
    <path d="M0 304 Q64 264 128 304 T256 304 T384 304 T512 304 V512 H0 Z" fill="#1FB5A8"/>
    <path d="M-64 358 Q0 318 64 358 T192 358 T320 358 T448 358 T576 358 V512 H-64 Z" fill="#14877F"/>
    <path d="M0 412 Q64 372 128 412 T256 412 T384 412 T512 412 V512 H0 Z" fill="#0C5B57"/>
  </g>

  <!-- Serveur flottant (deux unités empilées), légèrement incliné -->
  <g transform="rotate(-6 256 170)">
    <rect x="168" y="100" width="176" height="60" rx="16" fill="#F4F6F3"/>
    <circle cx="198" cy="130" r="9" fill="#1FB5A8"/>
    <rect x="226" y="123" width="94" height="14" rx="7" fill="#0E1B2A"/>

    <rect x="168" y="172" width="176" height="60" rx="16" fill="#F4F6F3"/>
    <circle cx="198" cy="202" r="9" fill="#1FB5A8"/>
    <rect x="226" y="195" width="94" height="14" rx="7" fill="#0E1B2A"/>
  </g>

  <!-- Anneau extérieur -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="#1FB5A8" stroke-width="8"/>
</svg>
